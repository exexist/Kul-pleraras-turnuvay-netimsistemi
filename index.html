<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body style="margin:0"><title>FIFA 17 Arkadaş Ligi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap">
<style>
/* Düzen: sol kenar çubuğu (masaüstü) / alt sekme çubuğu (telefon), sahada dikey 4-3-3 dizilişi, koyu spor paneli */
:root{
  --bg:#080c13; --bg2:#0d1320; --card:#121a2a; --card2:#192339; --line:#243250; --fg:#e8eef8; --mut:#8a9ab6;
  --accent:#f2b53c; --accent-fg:#1b1303; --blue:#4c9bff; --good:#2fd08a; --bad:#ff5b69; --warn:#ffb020;
  --pitch1:#135a2f; --pitch2:#16683a; --pitchline:rgba(255,255,255,.55); --shadow:0 10px 30px rgba(0,0,0,.35);
  --gk:#f2b53c; --df:#4c9bff; --mf:#2fd08a; --at:#ff5b69;
  --f-disp:"Barlow Condensed","Arial Narrow",system-ui,sans-serif; --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#edf1f7; --bg2:#e2e9f3; --card:#ffffff; --card2:#f2f5fa; --line:#d3dce9; --fg:#0f1a2b; --mut:#566783;
  --accent:#b57600; --accent-fg:#ffffff; --blue:#1d6ee0; --good:#0c9a60; --bad:#d3263a; --warn:#b56a00; --shadow:0 8px 24px rgba(20,40,80,.12);
  --gk:#b57600; --df:#1d6ee0; --mf:#0c9a60; --at:#d3263a; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#edf1f7; --bg2:#e2e9f3; --card:#ffffff; --card2:#f2f5fa; --line:#d3dce9; --fg:#0f1a2b; --mut:#566783;
  --accent:#b57600; --accent-fg:#ffffff; --blue:#1d6ee0; --good:#0c9a60; --bad:#d3263a; --warn:#b56a00; --shadow:0 8px 24px rgba(20,40,80,.12);
  --gk:#b57600; --df:#1d6ee0; --mf:#0c9a60; --at:#d3263a; color-scheme:light}
:root[data-theme="dark"]{
  --bg:#080c13; --bg2:#0d1320; --card:#121a2a; --card2:#192339; --line:#243250; --fg:#e8eef8; --mut:#8a9ab6;
  --accent:#f2b53c; --accent-fg:#1b1303; --blue:#4c9bff; --good:#2fd08a; --bad:#ff5b69; --warn:#ffb020; --shadow:0 10px 30px rgba(0,0,0,.35);
  --gk:#f2b53c; --df:#4c9bff; --mf:#2fd08a; --at:#ff5b69; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body{padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
h1,h2,h3,h4{font-family:var(--f-disp);font-weight:700;letter-spacing:.01em;margin:0;line-height:1.1;text-wrap:balance}
h1{font-size:2.1rem} h2{font-size:1.5rem} h3{font-size:1.2rem} h4{font-size:1rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue)}
.num,.tn{font-variant-numeric:tabular-nums}
.mut{color:var(--mut)} .good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)} .acc{color:var(--accent)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Kabuk */
.app{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;align-self:start;height:100vh;padding:18px 14px;border-right:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;gap:14px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px}
.brand b{font-family:var(--f-disp);font-size:1.45rem;letter-spacing:.02em;line-height:1}
.brand small{display:block;color:var(--mut);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase}
.logo{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-family:var(--f-disp);font-weight:800;font-size:1.25rem}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;background:none;border:0;border-radius:10px;padding:10px 12px;text-align:left;color:var(--mut);font-weight:600}
.nav button svg{width:20px;height:20px;flex:none}
.nav button:hover{background:var(--card);color:var(--fg)}
.nav button[aria-current="page"]{background:var(--card2);color:var(--fg);box-shadow:inset 3px 0 0 var(--accent)}
.nav .badge{margin-left:auto}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.main{min-width:0;padding-block:0 40px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:12px;padding:10px 24px}
.who{display:flex;gap:6px;flex-wrap:wrap}
.who button{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px 4px 6px;font-weight:600}
.who button[aria-pressed="true"]{border-color:var(--accent);background:var(--card2)}
.who .b{font-size:.8rem;color:var(--mut)}
.top .sp{flex:1}
.ticker{overflow:hidden;border-top:1px solid var(--line);background:var(--bg2);height:32px;display:flex;align-items:center}
.live{flex:none;display:flex;align-items:center;gap:6px;background:var(--bad);color:#fff;font-weight:800;font-size:.72rem;letter-spacing:.12em;padding:0 12px;height:100%}
.live i{width:7px;height:7px;border-radius:50%;background:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25;transform:scale(.7)}}
.ticker-track{display:flex;gap:44px;white-space:nowrap;animation:tick 70s linear infinite;padding-left:24px;font-size:.88rem}
.ticker:hover .ticker-track{animation-play-state:paused}
@keyframes tick{to{transform:translateX(-50%)}}
.ticker-track span b{color:var(--accent);margin-right:6px}
.page{padding:22px 24px;display:flex;flex-direction:column;gap:20px;max-width:1280px}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
.page-h p{margin:4px 0 0;color:var(--mut)}

/* Ortak bileşenler */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card.flat{background:transparent}
.card h3{margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h3 .more{margin-left:auto;font-family:var(--f-body);font-size:.8rem;font-weight:600;color:var(--blue);background:none;border:0}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)} .g12{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.row.wrap{flex-wrap:wrap}
.sp1{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--card2);border-radius:10px;padding:8px 14px;font-weight:600;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--mut);transform:translateY(-1px)}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.btn.pri:hover{filter:brightness(1.08)}
.btn.bad{background:color-mix(in srgb,var(--bad) 16%,var(--card));border-color:color-mix(in srgb,var(--bad) 45%,var(--line));color:var(--bad)}
.btn.good{background:color-mix(in srgb,var(--good) 16%,var(--card));border-color:color-mix(in srgb,var(--good) 45%,var(--line));color:var(--good)}
.btn.sm{padding:5px 10px;font-size:.84rem;border-radius:8px}
.btn.ghost{background:none}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn svg{width:16px;height:16px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:.76rem;font-weight:700;letter-spacing:.03em;background:var(--card2);border:1px solid var(--line);white-space:nowrap}
.pill.GK{color:var(--gk)} .pill.DEF{color:var(--df)} .pill.MID{color:var(--mf)} .pill.ATT{color:var(--at)}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--accent);color:var(--accent-fg);font-size:.72rem;font-weight:800}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.lbl{font-size:.74rem;text-transform:uppercase;letter-spacing:.09em;color:var(--mut);font-weight:700}
input[type=text],input[type=number],input[type=search],select,textarea{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
textarea{min-height:120px;font-family:ui-monospace,Menlo,monospace;font-size:.8rem}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:9px 14px;font-weight:700;color:var(--mut);white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);text-align:left;padding:8px 10px;font-weight:700;white-space:nowrap}
td{padding:9px 10px;border-top:1px solid var(--line);white-space:nowrap}
tr.hl td{background:color-mix(in srgb,var(--accent) 10%,transparent)}
td.c,th.c{text-align:center} td.r,th.r{text-align:right}
.crest{display:block;flex:none;filter:drop-shadow(0 3px 5px rgba(0,0,0,.35))}
.stars{color:var(--accent);letter-spacing:1px}
.empty{padding:26px;text-align:center;color:var(--mut);border:1px dashed var(--line);border-radius:12px}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:var(--f-disp);font-size:1.9rem;line-height:1}
.kpi span{font-size:.74rem;color:var(--mut);text-transform:uppercase;letter-spacing:.09em;font-weight:700}
.bar{height:8px;border-radius:99px;background:var(--bg2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .5s}
.chip{border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:5px 12px;font-weight:600;font-size:.85rem}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:transparent}

/* Oyuncu */
.av{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-disp);font-weight:800;font-size:1rem;color:#fff;border:2px solid rgba(255,255,255,.25)}
.av.GK{background:linear-gradient(135deg,#b8801a,#f2b53c)} .av.DEF{background:linear-gradient(135deg,#1f58b3,#4c9bff)}
.av.MID{background:linear-gradient(135deg,#0c7a4b,#2fd08a)} .av.ATT{background:linear-gradient(135deg,#b3202f,#ff5b69)}
.ovr{display:inline-grid;place-items:center;min-width:34px;height:26px;border-radius:7px;font-family:var(--f-disp);font-weight:800;font-size:1.05rem;color:#14100a}
.ovr.t1{background:linear-gradient(135deg,#f6d36b,#e0a526)} .ovr.t2{background:#cfd8e6} .ovr.t3{background:#d9a273} .ovr.t4{background:var(--card2);color:var(--fg);border:1px solid var(--line)}
.plist{display:flex;flex-direction:column}
.prow{display:grid;grid-template-columns:38px minmax(0,1fr) auto auto auto;gap:12px;align-items:center;padding:9px 6px;border-top:1px solid var(--line);border-radius:8px}
.prow:first-child{border-top:0}
.prow:hover{background:var(--card2)}
.prow .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .sub{font-size:.8rem;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pname{background:none;border:0;padding:0;font-weight:700;text-align:left;color:inherit}
.pname:hover{color:var(--accent);text-decoration:underline}
.val{font-family:var(--f-disp);font-weight:700;font-size:1.1rem;white-space:nowrap}

/* Saha */
.squad-wrap{display:grid;grid-template-columns:minmax(0,520px) minmax(0,1fr);gap:18px;align-items:start}
.pitch{position:relative;aspect-ratio:3/4;border-radius:16px;overflow:hidden;border:2px solid #0b3a1d;box-shadow:var(--shadow);
  background:repeating-linear-gradient(180deg,var(--pitch1) 0 8.33%,var(--pitch2) 8.33% 16.66%);user-select:none}
.pitch svg.lines{position:absolute;inset:0;width:100%;height:100%}
.slot{position:absolute;transform:translate(-50%,-50%);width:23%;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;padding:0;touch-action:manipulation}
.slot .shirt{width:clamp(36px,9.6vw,54px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-family:var(--f-disp);font-weight:800;font-size:clamp(.95rem,2.4vw,1.35rem);color:#fff;border:2.5px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.45);transition:.15s;position:relative}
.slot .shirt.GK{background:#c48a14} .slot .shirt.DEF{background:#2765c4} .slot .shirt.MID{background:#12915a} .slot .shirt.ATT{background:#c9303f}
.slot .shirt.empty{background:rgba(0,0,0,.35);border-style:dashed;font-size:1.4rem}
.slot .lab{max-width:100%;padding:1px 7px;border-radius:6px;background:rgba(0,0,0,.62);color:#fff;font-size:clamp(.62rem,1.7vw,.8rem);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .pos{font-size:.64rem;color:#fff;opacity:.85;font-weight:700;text-shadow:0 1px 2px #000}
.slot:hover .shirt{transform:scale(1.08)}
.slot.sel .shirt{box-shadow:0 0 0 4px var(--accent),0 6px 16px rgba(0,0,0,.5);transform:scale(1.12)}
.slot.over .shirt{box-shadow:0 0 0 4px #fff}
.slot .oop{position:absolute;right:-6px;top:-6px;width:18px;height:18px;border-radius:50%;background:var(--warn);color:#000;font-size:.7rem;font-weight:800;display:grid;place-items:center;border:1.5px solid #000}
.slot .rt{position:absolute;left:-8px;bottom:-4px;font-size:.66rem;font-weight:800;background:#000b;border-radius:6px;padding:0 4px}
.form-tag{position:absolute;left:10px;top:8px;color:#fff;font-family:var(--f-disp);font-weight:800;letter-spacing:.1em;background:#0008;padding:2px 10px;border-radius:6px;z-index:2}
.bench{display:flex;gap:8px;flex-wrap:wrap}
.bench .bp{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:6px 10px 6px 6px;min-width:150px}
.bench .bp.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.bench .bp.over{border-color:#fff}
.bench .bp .t{font-weight:700;font-size:.88rem;line-height:1.1}
.bench .bp .s{font-size:.72rem;color:var(--mut)}
.hint{font-size:.82rem;color:var(--mut);display:flex;gap:8px;align-items:center}

/* Haber */
.news-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.news{border-radius:14px;overflow:hidden;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column}
.news.big{grid-column:span 2}
.art{position:relative;aspect-ratio:2/1;overflow:hidden;color:#fff;display:flex;align-items:flex-end;padding:14px}
.news.big .art{aspect-ratio:2.6/1}
.art svg.pat{position:absolute;inset:0;width:100%;height:100%}
.art .tag{position:relative;font-family:var(--f-disp);font-weight:800;letter-spacing:.14em;font-size:.82rem;background:#000a;padding:3px 10px;border-radius:5px}
.art .tag.brk{background:var(--bad)}
.art .cr{position:absolute;right:12px;top:10px}
.art .big-t{position:absolute;left:14px;top:8px;font-family:var(--f-disp);font-weight:800;font-size:3.6rem;line-height:1;opacity:.28}
.news-b{padding:14px;display:flex;flex-direction:column;gap:6px}
.news-b h3{font-size:1.25rem}
.news-b p{margin:0;color:var(--mut);font-size:.92rem}
.news-b time{font-size:.74rem;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.news.rumor .art .tag{background:var(--warn);color:#000}

/* Maç */
.match{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 4px;border-top:1px solid var(--line)}
.match:first-of-type{border-top:0}
.match .tm{display:flex;align-items:center;gap:10px;min-width:0;font-weight:700}
.match .tm.r{justify-content:flex-end;text-align:right}
.match .tm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score{font-family:var(--f-disp);font-weight:800;font-size:1.9rem;background:var(--bg2);border-radius:10px;padding:2px 16px;min-width:96px;text-align:center;white-space:nowrap}
.score.todo{color:var(--mut);font-size:1.1rem;padding:8px 12px;min-width:56px}
.wk{font-family:var(--f-disp);font-weight:700;color:var(--mut);letter-spacing:.1em;text-transform:uppercase;font-size:.82rem;margin:14px 0 2px}
.stepper{display:inline-flex;align-items:center;gap:6px}
.stepper button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--card2);font-weight:800}
.stepper b{min-width:22px;text-align:center;font-variant-numeric:tabular-nums}
.form-pill{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:5px;font-size:.7rem;font-weight:800;color:#fff;margin-right:2px}
.form-pill.W{background:var(--good)} .form-pill.D{background:var(--mut)} .form-pill.L{background:var(--bad)}
.prob{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--bg2)}
.prob i{display:block;height:100%}

/* Sponsor */
.sp-card{display:flex;flex-direction:column;gap:10px;position:relative}
.sp-card.taken{opacity:.62}
.sp-logo{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-disp);font-weight:800;font-size:1.3rem;color:#fff}
.sp-cond{font-size:.9rem;padding:8px 10px;background:var(--bg2);border-radius:10px;display:flex;flex-direction:column;gap:6px}
.sp-money{display:flex;gap:8px;flex-wrap:wrap}
.sp-money .pill b{font-family:var(--f-disp);font-size:1rem}

/* Modal / toast */
.ov{position:fixed;inset:0;z-index:100;background:rgba(3,6,12,.66);backdrop-filter:blur(3px);display:grid;place-items:center;padding:16px;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.md{background:var(--card);border:1px solid var(--line);border-radius:18px;width:min(640px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:var(--shadow);animation:pop .18s}
.md.wide{width:min(860px,100%)}
@keyframes pop{from{transform:translateY(12px) scale(.98);opacity:0}}
.md-h{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:2}
.md-h h3{flex:1}
.md-b{padding:18px;display:flex;flex-direction:column;gap:14px}
.md-f{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;padding:14px 18px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--card)}
.x{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--card2);display:grid;place-items:center}
.toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:200;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{background:var(--card2);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:10px 14px;box-shadow:var(--shadow);max-width:340px;animation:pop .2s;pointer-events:auto}
.toast.good{border-left-color:var(--good)} .toast.bad{border-left-color:var(--bad)}
.toast b{display:block;font-size:.9rem}
.toast span{font-size:.82rem;color:var(--mut)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:150}
.trophy-wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}

function powerRaw(c){ const L=S.lineup[c]||[]; let t=0; L.forEach((id,i)=>{const p=id!=null&&P(id); t+= p? p.ovr-pen(p,slotsOf(c)[i].g) : 40;}); return r2(t/11); }
function squadValue(c){ return r2(SQ[c].reduce((a,p)=>a+p.val,0)); }
function swapSlots(c,a,b){ // a,b: {t:'s'|'b',i|id}
  const L=S.lineup[c];
  const get=x=>x.t==='s'?L[x.i]:x.id;
  const ga=get(a), gb=get(b);
  if(a.t==='s') L[a.i]=gb; if(b.t==='s') L[b.i]=ga;
  if(a.t==='b'&&b.t==='b') return;
}

const ms = (season=S.season)=>season===0?S.matches:S.matches.filter(m=>m.season===season);
function table(season=S.season){ return memo('t'+season,()=>tableRaw(season)); }
function tableRaw(season){
  const T={}; CIDS.forEach(c=>T[c]={c,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0,cs:0,hw:0,form:[]});
  ms(season).filter(m=>m.played).sort((a,b)=>a.week-b.week).forEach(m=>{
    const h=T[m.home],a=T[m.away]; h.p++;a.p++;h.gf+=m.hg;h.ga+=m.ag;a.gf+=m.ag;a.ga+=m.hg;
    if(m.ag===0)h.cs++; if(m.hg===0)a.cs++;
    if(m.hg>m.ag){h.w++;a.l++;h.pts+=3;h.hw++;h.form.push('W');a.form.push('L')}
    else if(m.hg<m.ag){a.w++;h.l++;a.pts+=3;a.form.push('W');h.form.push('L')}
    else{h.d++;a.d++;h.pts++;a.pts++;h.form.push('D');a.form.push('D')}
  });
  const rows=Object.values(T); rows.forEach(r=>r.gd=r.gf-r.ga);
  rows.sort((x,y)=>y.pts-x.pts||y.gd-x.gd||y.gf-x.gf||x.c.localeCompare(y.c));
  rows.forEach((r,i)=>r.rank=i+1); return rows;
}
function pstats(season=S.season){ return memo('p'+season,()=>pstatsRaw(season)); }
function pstatsRaw(season){
  const g={},a={},clubGoals={};
  ms(season).filter(m=>m.played).forEach(m=>{
    m.sc.forEach(([id,n,c])=>{g[id]=(g[id]||0)+n});
    m.as.forEach(([id,n])=>{a[id]=(a[id]||0)+n});
  });
  if(season===0) ALL.forEach(p=>{ if(p.hg>0) g[p.id]=(g[p.id]||0)+p.hg; if(p.ha>0) a[p.id]=(a[p.id]||0)+p.ha; });
  return {g,a};
}
function scorers(season=S.season,kind='g'){
  const st=pstats(season), M=kind==='g'?st.g:st.a, O=kind==='g'?st.a:st.g;
  return Object.keys(M).map(id=>({id:+id,n:M[id],o:O[id]||0,p:ALL.get(+id)||{name:'(silinmiş oyuncu)',club:null,pos:'ST',g:'ST',cat:'ATT',ovr:0}})).sort((x,y)=>y.n-x.n||y.o-x.o||x.p.name.localeCompare(y.p.name));
}

function pay(c,amt,desc,cat,ref){
  if(c==null||c==='bank') return;
  amt=r2(amt); S.budget[c]=r2((S.budget[c]||0)+amt);
  S.ledger.unshift({id:'l'+(S.seq++),t:Date.now(),season:S.season,club:c,amt,desc,cat:cat||'diger',ref:ref||null});
  if(S.ledger.length>500) S.ledger.length=500;
}
function debt(c){ return r2(S.loans.filter(l=>l.borrower===c&&l.balance>0.001).reduce((a,l)=>a+l.balance,0)); }
function credit(c){ return r2(S.loans.filter(l=>l.lender===c&&l.balance>0.001).reduce((a,l)=>a+l.balance,0)); }
function takeLoan(borrower,lender,amt,rate,note){
  amt=r2(amt); if(amt<=0) return 'Tutar geçersiz';
  if(lender==='bank'){ if(debt(borrower)+amt>S.set.bankMax+1e-9) return `Banka limiti aşılıyor (en fazla ${money(S.set.bankMax)} toplam borç)`; }
  else { if(S.budget[lender]<amt) return `${cname(lender)} bütçesi yetersiz`; }
  const L={id:'ln'+(S.seq++),t:Date.now(),season:S.season,borrower,lender,principal:amt,balance:amt,rate,paid:0,interestAdded:0,lastInt:S.season-1,note:note||''};
  S.loans.push(L);
  pay(borrower,amt,`Borç alındı (${cname(lender)}, %${rate} faiz)`,'borc',L.id);
  if(lender!=='bank') pay(lender,-amt,`${cname(borrower)} kulübüne borç verildi`,'borc',L.id);
  newsAdd({type:'finance',title:`${cname(borrower)} ${money(amt)} borç aldı`,body:`${cname(lender)} kaynaklı borç %${rate} sezonluk faizle işlendi. ${note?'Not: '+note:''}`,club:borrower});
  return null;
}
function repay(id,amt){
  const L=S.loans.find(l=>l.id===id); if(!L) return 'Borç bulunamadı';
  amt=r2(Math.min(amt,L.balance)); if(amt<=0) return 'Tutar geçersiz';
  if(S.budget[L.borrower]<amt) return 'Bütçe yetersiz';
  pay(L.borrower,-amt,`Borç ödemesi → ${cname(L.lender)}`,'borc',L.id);
  if(L.lender!=='bank') pay(L.lender,amt,`${cname(L.borrower)} borç ödemesi`,'borc',L.id);
  L.balance=r2(L.balance-amt); L.paid=r2(L.paid+amt); if(L.balance<=0.001) bumpConf(L.borrower,2,'Borç tamamen kapandı');
  newsAdd({type:'finance',title:`${cname(L.borrower)} borcundan ${money(amt)} ödedi`,body:L.balance>0.001?`Kalan borç ${money(L.balance)}.`:'Borç tamamen kapandı.',club:L.borrower});
  return null;
}
function applyInterest(){
  let tot=0; const lines=[];
  S.loans.filter(l=>l.balance>0.001&&l.lastInt<S.season).forEach(l=>{
    const add=r2(l.balance*l.rate/100); l.balance=r2(l.balance+add); l.interestAdded=r2((l.interestAdded||0)+add); l.lastInt=S.season; tot+=add; lines.push([l.borrower,add,l.id]);
  });
  return {tot:r2(tot),lines};
}

function mkList(){
  const f=UI.mk, q=f.q.trim().toLowerCase(); let L=[...ALL.values()];
  L=L.filter(p=>{
    if(q&&!(p.name.toLowerCase().includes(q)||p.team.toLowerCase().includes(q)||p.nat.toLowerCase().includes(q))) return false;
    if(f.pos&&!(p.pos===f.pos||p.cat===f.pos)) return false;
    if(f.own==='free'&&p.club) return false; if(f.own==='owned'&&!p.club) return false; if(CIDS.includes(f.own)&&p.club!==f.own) return false; if(f.own==='est'&&!p.est) return false;
    if(f.team&&p.team!==f.team) return false; if(f.minOvr&&p.ovr<f.minOvr) return false; if(f.maxVal!==''&&p.val>+f.maxVal) return false;
    if(f.wk&&!(p.age<=21&&p.pot>=85)) return false; if(f.aff&&p.val>S.budget[UI.club]) return false; return true;
  });
  const sorts={ovr:(a,b)=>b.ovr-a.ovr||b.val-a.val,val:(a,b)=>b.val-a.val||b.ovr-a.ovr,valA:(a,b)=>a.val-b.val||b.ovr-a.ovr,pot:(a,b)=>b.pot-a.pot||b.ovr-a.ovr,ageA:(a,b)=>a.age-b.age||b.ovr-a.ovr,name:(a,b)=>a.name.localeCompare(b.name,'tr')};
  L.sort(sorts[f.sort]||sorts.ovr); return L;
}

  const st=document.createElement('style'); st.textContent='@media(max-width:760px){.lbl-d{display:none}.lbl-m{display:inline!important}}'; document.head.appendChild(st);

let lastTick='';
function render(){
  if(!$('#page')) shell();
  applyClubTheme(); const pg=$('#page'), y=window.scrollY, changed=UI._shown!==UI.page;
  $$('#nav button').forEach(b=>{ if(b.dataset.nav===UI.page) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
  setSync(SYNC.state); $('#who').innerHTML=clubSwitch(); $('#seasonTag').textContent='SEZON '+S.season;
  const items=S.news.slice(0,12).map(n=>`<span><b>${TAGS[n.type]||'HABER'}</b>${esc(n.title)}</span>`).join('');
  if(items!==lastTick){ lastTick=items; $('#ticker').innerHTML=items+items; }
  const mkq=document.activeElement&&document.activeElement.id==='mk-q';
  const html=(PAGE[UI.page]||PAGE.ana)(); if(changed||html!==UI._html){ pg.innerHTML=html; UI._html=html; }
  UI._shown=UI.page; if(!changed) window.scrollTo(0,y); try{ fx(changed); loadImgs(); }catch(e){}

function go(p){ UI.page=p; UI.sel=null; try{ history.replaceState(null,'','#'+p) }catch(e){ try{location.hash=p}catch(_){} } render(); window.scrollTo(0,0); }
function refreshMatchModal(){ const md=$('.md'), y=md?md.scrollTop:0; const b=$('#mdb'); if(b){ b.innerHTML=matchModalBody(); } if(md) md.scrollTop=y; }
function doSwap(a,b){
  const c=UI.club;
  if(a.t==='b'&&b.t==='b'){ UI.sel=b; render(); return; }
  mut(()=>{ const L=S.lineup[c];
    if(a.t==='s'&&b.t==='s'){ [L[a.i],L[b.i]]=[L[b.i],L[a.i]]; }
    else if(a.t==='s'&&b.t==='b'){ L[a.i]=b.id; } else if(a.t==='b'&&b.t==='s'){ L[b.i]=a.id; } });
  UI.sel=null; render();
}
const parseRef=s=>{ if(!s) return null; const [t,v]=s.split(':'); return t==='s'?{t:'s',i:+v}:t==='b'?{t:'b',id:+v}:null; };

  offerGo:()=>{ const id=UI.off.id, b=$('#of-b').value, pr=+$('#of-p').value, sw=$('#of-s').value; const p=P(id);

  reject:el=>mut(()=>{ const o=S.offers.find(x=>x.id===el.dataset.id); if(o) o.status='rejected'; }),
  sell:el=>{ const p=P(+el.dataset.id); if(mut(()=>sellToMarket(+el.dataset.id))){ closeModal(); toast(`${p.name} piyasaya satıldı`,'','good'); } },
  release:el=>{ const p=P(+el.dataset.id); if(mut(()=>release(+el.dataset.id))){ closeModal(); toast(`${p.name} serbest bırakıldı`); } },

/* ================= HAFTANIN 11'İ ================= */
function xiOf(list){
  const played=list.filter(m=>m.played); if(!played.length) return [];
  const sc={}, add=(id,v)=>{sc[id]=(sc[id]||0)+v};
  played.forEach(m=>{
    m.sc.forEach(([id,n])=>{ add(id,n*3); if(n>=3) add(id,2); }); m.as.forEach(([id,n])=>add(id,n*2));
    [[m.home,m.hg,m.ag],[m.away,m.ag,m.hg]].forEach(([c,f,a])=>{ (SQ[c]||[]).forEach(p=>{ let v=0; if(f>a) v+=1; if(a===0&&(p.cat==='GK'||p.cat==='DEF')) v+=2; if(a===0&&p.cat==='GK') v+=1; if(v) add(p.id,v); }); });
  });
  const clubs=new Set(); played.forEach(m=>{clubs.add(m.home);clubs.add(m.away)});
  const pool=[...ALL.values()].filter(p=>p.club&&clubs.has(p.club)), used=new Set(), out=new Array(11).fill(null);
  const val=p=>(sc[p.id]||0)*10+p.ovr/10, order=[0,2,3,1,4,9,8,10,5,6,7];
  for(const i of order){ let b=null; for(const p of pool){ if(used.has(p.id)||p.g!==SLOTS[i].g) continue; if(!b||val(p)>val(b)) b=p; } if(b){out[i]=b.id;used.add(b.id);} }
  for(const i of order){ if(out[i]!=null) continue; let b=null,bs=-1e9; for(const p of pool){ if(used.has(p.id)) continue; const v=val(p)-pen(p,SLOTS[i].g)*2; if(v>bs){bs=v;b=p} } if(b){out[i]=b.id;used.add(b.id)} }
  return out;
}
const xiNames = xi => xi.filter(x=>x!=null).map(id=>P(id)?.name).filter(Boolean).join(', ');
function maybeTotw(m){
  const wk=ms(m.season).filter(x=>x.week===m.week); if(!wk.every(x=>x.played)) return;
  const xi=xiOf(wk), ex=S.news.find(n=>n.totw&&n.totw.season===m.season&&n.totw.week===m.week);
  if(ex){ ex.totw.ids=xi; ex.body=xiNames(xi); return; }
  newsAdd({type:'totw',title:`Hafta ${m.week}: Haftanın 11'i belli oldu`,body:xiNames(xi),totw:{season:m.season,week:m.week,ids:xi}});

/* ================= ORAN MODELİ (arşiv maçları + bu sezon) ================= */
const HISTM = (D.hist||[]).map(r=>[CIDS[r[0]],r[1],r[2],CIDS[r[3]]]);
const archiveMatches = ()=>HISTM.map(([h,x,y,a],i)=>({id:'a'+i,season:0,week:0,home:h,away:a,hg:x,ag:y,played:true,sc:[],as:[]}));
const fact = n=>{let f=1;for(let i=2;i<=n;i++)f*=i;return f};
const pois = (l,k)=>Math.exp(-l)*Math.pow(l,k)/fact(k);
function modelRows(){ return [...HISTM,...S.matches.filter(m=>m.played).map(m=>[m.home,m.hg,m.ag,m.away])]; }
/* Saha avantajı yok: ev/deplasman ayrımı yapılmaz, her takımın tüm maçları (iç saha + dış saha) birlikte hesaplanır. */
function strengthModel(){
  const rows=modelRows(), n=rows.length||1, avg=rows.reduce((a,r)=>a+r[1]+r[2],0)/(2*n)||1.3, st={};
  CIDS.forEach(c=>st[c]={gf:0,ga:0,g:0});
  rows.forEach(([h,x,y,a])=>{ st[h].gf+=x; st[h].ga+=y; st[h].g++; st[a].gf+=y; st[a].ga+=x; st[a].g++; });
  const K=8; CIDS.forEach(c=>{ const s=st[c]; s.att=(s.gf+avg*K)/(s.g+K)/avg; s.def=(s.ga+avg*K)/(s.g+K)/avg; });
  return {avg,st,n};
}
const GCACHE=new Map();
function grid(h,a){
  const M=strengthModel(), key=`${h}|${a}|${M.n}|${power(h)}|${power(a)}`; if(GCACHE.has(key)) return GCACHE.get(key);
  const mk=(x,y)=>M.avg*M.st[x].att*M.st[y].def;
  const d=clamp(1+.015*(power(h)-power(a)),.8,1.2);
  const lh=mk(h,a)*Math.sqrt(d), la=mk(a,h)/Math.sqrt(d);
  const G=[]; let tot=0; for(let i=0;i<=10;i++){ G[i]=[]; for(let j=0;j<=10;j++){ G[i][j]=pois(lh,i)*pois(la,j); tot+=G[i][j]; } }
  for(let i=0;i<=10;i++) for(let j=0;j<=10;j++) G[i][j]/=tot;
  const r={G,lh,la}; if(GCACHE.size>200) GCACHE.clear(); GCACHE.set(key,r); return r;
}
function probOf(h,a,f){ const {G}=grid(h,a); let p=0; for(let i=0;i<=10;i++) for(let j=0;j<=10;j++) if(f(i,j)) p+=G[i][j]; return p; }
function probs1x2(h,a){
  const H=probOf(h,a,(x,y)=>x>y), D_=probOf(h,a,(x,y)=>x===y), hp=Math.round(H*100), dp=Math.round(D_*100); return {h:hp,d:dp,a:100-hp-dp};
}

function placeBet(club,mid,pick,stake){
  const m=S.matches.find(x=>x.id===mid); if(!m||m.played) return 'Maç oynanmış ya da yok';
  if(club===m.home||club===m.away) return 'Kendi maçına bahis oynayamazsın';
  stake=r2(stake); if(!(stake>0)) return 'Tutar gir'; if(stake>S.set.maxBet) return `En fazla ${money(S.set.maxBet)} bahis oynanır`;
  if(S.budget[club]<stake) return 'Bütçe yetersiz';
  const sel=selOf(pick);
  if(S.bets.some(b=>b.mid===mid&&b.club===club&&selOf(b.pick).g===sel.g)) return `Bu maçta "${sel.gt}" türünde zaten kuponun var`;
  const o=oddsOf(m,pick), b={id:'b'+(S.seq++),t:Date.now(),season:S.season,mid,club,pick,stake,odds:o,status:'open',label:`${cname(m.home)} - ${cname(m.away)}`};
  S.bets.unshift(b); pay(club,-stake,`Bahis: ${b.label} · ${sel.pl} (${o})`,'bahis','bet'+b.id);

/* ================= TARAFTAR GÜVENİ & KASA BASKISI ================= */
function ensureCrisis(){
  S.conf=S.conf||{demir:60,emir:75,tugra:55,yigit:55}; CIDS.forEach(c=>{ if(S.conf[c]==null) S.conf[c]=60; });
  S.inj=S.inj||{}; S.cups=S.cups||[]; S.form=S.form||{}; if(S.cup===undefined) S.cup=null;
  S.confLog=S.confLog||[]; delete S.forced;
  if(S.set.confLow==null||S.set.confLow===25) S.set.confLow=30;
  S.set.drainStreak=S.set.drainStreak??.4; S.set.drainLow=S.set.drainLow??.4; delete S.set.forcedRate;
}
function clubGames(c){ return ms().filter(m=>m.played&&(m.home===c||m.away===c)).sort((a,b)=>a.week-b.week); }
/* maç sonuçlarından gelen güven değişimi: farklı yenilgi daha çok düşürür */
function formDelta(c){
  let d=0, streak=0;
  clubGames(c).forEach(m=>{
    const f=m.home===c?m.hg:m.ag, g=m.home===c?m.ag:m.hg, diff=f-g;
    if(diff>0){ d+=3+Math.min(4,diff-1); streak=0; }
    else if(diff===0){ streak++; }
    else { d-=3+Math.min(9,(-diff-1)*2); streak++; }
    if(diff<=0&&streak>=3) d-=2;
  });
  return d;
}
function rankDrift(c){ const tb=table(); if(!tb.some(r=>r.p>0)) return 0; return [4,1,-1,-4][tb.find(r=>r.c===c).rank-1]; }
function confidence(c){ return clamp(Math.round((S.conf?.[c]??60)+formDelta(c)+rankDrift(c)),0,100); }
function confMult(c){ return r2(.7+.6*((S.conf?.[c]??60)/100)); }
function confColor(v){ return v>=60?'var(--good)':v>=S.set.confLow+10?'var(--warn)':'var(--bad)'; }
function winlessStreak(c,upToWeek=99){
  let n=0; const L=clubGames(c).filter(x=>x.week<=upToWeek).reverse();
  for(const x of L){ const f=x.home===c?x.hg:x.ag, g=x.home===c?x.ag:x.hg; if(f>g) break; n++; } return n;
}
function pressure(c,m){
  const st=winlessStreak(c,m?m.week:99), cf=confidence(c); let amt=0; const why=[];
  if(st>=3){ amt+=S.set.drainStreak*(1+.5*Math.min(2,st-3)); why.push(`${st} maçtır kazanamıyor`); }
  if(cf<S.set.confLow){ amt+=S.set.drainLow; why.push(`taraftar güveni ${cf} (eşik ${S.set.confLow})`); }
  return {amt:r2(amt),why:why.join(' ve '),streak:st,conf:cf};
}
function bumpConf(c,d,why){
  if(!d||!CL[c]) return; S.conf[c]=clamp(Math.round((S.conf[c]??60)+d),0,100);
  S.confLog.unshift({t:Date.now(),c,d,why,season:S.season}); if(S.confLog.length>60) S.confLog.length=60;
}
const signBonus = p => p.ovr>=90?6:p.ovr>=85?4:p.ovr>=80?2:1;
const sellPenalty = p => p.ovr>=90?5:p.ovr>=85?3:p.ovr>=80?1:0;

   ${pr.amt>0?`<div class="pill bad" style="margin-top:6px" title="${esc(pr.why)}">Baskı: -${money(pr.amt)} / maç</div>`:''}</div>`;

/* ---- Haftalık özet haberi ---- */
function weekSummary(m){
  const wk=ms(m.season).filter(x=>x.week===m.week); if(!wk.every(x=>x.played)) return;
  const tb=table(m.season), lead=tb[0], goals=wk.reduce((a,x)=>a+x.hg+x.ag,0);
  const big=[...wk].sort((a,b)=>Math.abs(b.hg-b.ag)-Math.abs(a.hg-a.ag)||(b.hg+b.ag)-(a.hg+a.ag))[0];
  const sc={}; wk.forEach(x=>x.sc.forEach(([id,n])=>sc[id]=(sc[id]||0)+n));
  const top=Object.entries(sc).sort((a,b)=>b[1]-a[1])[0], tp=top&&P(+top[0]);
  const res=wk.map(x=>`${CL[x.home].short} ${x.hg}-${x.ag} ${CL[x.away].short}`).join(' · ');
  const streak=CIDS.map(c=>({c,n:winlessStreak(c)})).sort((a,b)=>b.n-a.n)[0];
  const parts=[`Sonuçlar: ${res}.`,`Hafta ${m.week}'da toplam ${goals} gol atıldı.`];
  if(Math.abs(big.hg-big.ag)>=2) parts.push(`Haftanın farklı sonucu: ${cname(big.home)} ${big.hg}-${big.ag} ${cname(big.away)}.`);
  if(tp) parts.push(`Haftanın golcüsü ${tp.name} (${top[1]} gol).`);
  parts.push(`Lider ${cname(lead.c)} (${lead.pts} puan).`);
  if(streak.n>=3) parts.push(`${cname(streak.c)} ${streak.n} maçtır kazanamıyor.`);
  const ex=S.news.find(n=>n.wk&&n.wk.season===m.season&&n.wk.week===m.week), title=`Hafta ${m.week} özeti: ${cname(lead.c)} zirvede`;
  if(ex){ ex.title=title; ex.body=parts.join(' '); return; }
  const it=newsAdd({type:'league',club:lead.c,title,body:parts.join(' ')},true); it.wk={season:m.season,week:m.week};
}

function weeklySeries(season){
  const L=ms(season).filter(m=>m.played), maxW=Math.max(0,...L.map(m=>m.week)), pts={}, gf={}, ga={};
  CIDS.forEach(c=>{pts[c]=[0];gf[c]=[0];ga[c]=[0];});
  for(let w=1;w<=maxW;w++) CIDS.forEach(c=>{ let p=pts[c][w-1],f=gf[c][w-1],g=ga[c][w-1];
    L.filter(m=>m.week===w&&(m.home===c||m.away===c)).forEach(m=>{ const x=m.home===c?m.hg:m.ag, y=m.home===c?m.ag:m.hg; f+=x; g+=y; p+=x>y?3:x===y?1:0; });
    pts[c][w]=p; gf[c][w]=f; ga[c][w]=g; });
  return {maxW,pts,gf,ga};
}
function lineChart(series,maxW,title,unit=''){
  const W=520,H=230,pl=34,pr=14,pt=16,pb=26, all=CIDS.flatMap(c=>series[c]), mx=Math.max(3,...all), X=i=>pl+(maxW?i/maxW:0)*(W-pl-pr), Y=v=>H-pb-(v/mx)*(H-pt-pb);
  const grid=[0,.25,.5,.75,1].map(f=>{ const v=Math.round(mx*f), y=Y(v); return `<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${pl-6}" y="${y+4}" text-anchor="end" font-size="10" fill="var(--mut)">${v}</text>`; }).join('');
  const xs=Array.from({length:maxW+1},(_,i)=>i).filter(i=>maxW<=12||i%2===0).map(i=>`<text x="${X(i)}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--mut)">${i}</text>`).join('');
  const lines=CIDS.map(c=>{ const pts=series[c].map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' '), last=series[c][series[c].length-1];
    return `<polyline class="ln" pathLength="1" points="${pts}" fill="none" stroke="${CL[c].c1}" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/><circle class="dt" cx="${X(maxW)}" cy="${Y(last)}" r="4" fill="${CL[c].c1}"/>`; }).join('');
  return `<div class="card"><h3>${title}</h3><svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="${esc(title)}">${grid}${xs}${lines}</svg><div class="lgd">${CIDS.map(c=>`<span><i style="background:${CL[c].c1}"></i>${esc(CL[c].name)} <b>${series[c][series[c].length-1]}${unit}</b></span>`).join('')}</div></div>`;
}
function barsChart(){
  const tb=table(), mx=Math.max(1,...tb.flatMap(r=>[r.gf,r.ga]));
  return `<div class="card"><h3>Hücum & savunma</h3>${tb.map(r=>`<div style="margin:10px 0"><div class="row" style="justify-content:space-between;font-size:.86rem;margin-bottom:4px"><span class="row">${crest(r.c,20)}<b>${esc(CL[r.c].name)}</b></span><span class="mut">${r.p} maç</span></div>
   <div class="hb"><span class="hl">Attığı</span><div class="bar"><i style="width:${r.gf/mx*100}%;background:var(--good)"></i></div><b>${r.gf}</b></div>
   <div class="hb"><span class="hl">Yediği</span><div class="bar"><i style="width:${r.ga/mx*100}%;background:var(--bad)"></i></div><b>${r.ga}</b></div></div>`).join('')}</div>`;
}
function chartsTab(){
  const s=weeklySeries(S.season); if(!s.maxW) return '<div class="card"><div class="empty">Grafikler ilk maç girilince burada çizilir.</div></div>';
  const rk=[]; CIDS.forEach(c=>rk[c]=[]);
  return `<div class="grid g2">${lineChart(s.pts,s.maxW,'Hafta hafta puan','')}${lineChart(s.gf,s.maxW,'Atılan gol (kümülatif)','')}</div><div class="grid g2">${lineChart(s.ga,s.maxW,'Yenilen gol (kümülatif)','')}${barsChart()}</div>`;
}

const REDUCED = window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
function countUp(el){
  const to=+el.dataset.cnt; if(!isFinite(to)||REDUCED){ return; } const t0=performance.now(), dur=650;
  const step=t=>{ const k=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-k,3); el.textContent=Math.round(to*e); if(k<1) requestAnimationFrame(step); }; el.textContent='0'; requestAnimationFrame(step);
}
function fx(changed){
  const pg=$('#page'); if(!pg||REDUCED) return;
  if(changed){ pg.classList.remove('enter'); void pg.offsetWidth; pg.classList.add('enter');
    pg.querySelectorAll('.card,.hero,.news-card,.kpi').forEach((el,i)=>{ el.style.setProperty('--i',Math.min(i,14)); }); }
  pg.querySelectorAll('[data-cnt]').forEach(el=>{ if(changed||!el.dataset.done){ el.dataset.done=1; countUp(el); } });
}

function presStats(c){
  const L=[...archiveMatches(),...S.matches.filter(m=>m.played)].filter(m=>m.home===c||m.away===c); let w=0,d=0,l=0,gf=0,ga=0,big=null;
  L.forEach(m=>{ const f=m.home===c?m.hg:m.ag, g=m.home===c?m.ag:m.hg; gf+=f; ga+=g; if(f>g){w++; if(!big||f-g>big.d) big={d:f-g,txt:`${m.hg}-${m.ag} ${cname(m.home===c?m.away:m.home)}`};} else if(f===g)d++; else l++; });
  const tr=S.transfers.filter(t=>t.to===c).sort((a,b)=>b.price-a.price)[0], sl=S.transfers.filter(t=>t.from===c).sort((a,b)=>b.price-a.price)[0];
  const tit=S.titles.filter(t=>t.club===c).map(t=>t.season), rk=table().find(r=>r.c===c).rank;
  return {n:L.length,w,d,l,gf,ga,big,tr,sl,tit,rk,pct:L.length?Math.round(w/L.length*100):0,best:bestOf(c),spons:S.spons.filter(s=>s.club===c).length};
}

function cardBase(w,h,title,sub){

/* ================= KUPA TURNUVASI (tek maç, 4 takım) ================= */
const cupM = (id,h,a)=>({id,home:h,away:a,played:false,hg:0,ag:0,win:null,pen:null});
function cupStart(){
  if(S.cup&&!S.cup.champ) return 'Devam eden bir kupa var';
  if(S.cup&&S.cup.season===S.season&&S.cup.champ) return 'Bu sezonun kupası oynandı';
  const t=table(); S.cup={season:S.season,sf:[cupM('sf0',t[0].c,t[3].c),cupM('sf1',t[1].c,t[2].c)],final:null,champ:null,runner:null};
  newsAdd({type:'cup',title:`Sezon ${S.season} Kupası başlıyor`,body:`Yarı finaller: ${cname(t[0].c)} - ${cname(t[3].c)}, ${cname(t[1].c)} - ${cname(t[2].c)}. Tek maç, beraberlikte penaltılar.`,club:t[0].c});
  return null;
}
const cupGet=k=>!S.cup?null:k==='final'?S.cup.final:S.cup.sf[+k.slice(2)];
function cupResult(k,hg,ag,pw){
  const m=cupGet(k); if(!m) return 'Maç bulunamadı'; if(m.played) return 'Bu maç oynandı. Geri al ile düzeltebilirsin.';
  if(!(hg>=0&&ag>=0)||hg%1||ag%1) return 'Skor geçersiz';
  let w; if(hg>ag) w=m.home; else if(ag>hg) w=m.away; else { if(pw!==m.home&&pw!==m.away) return 'Beraberlikte penaltı galibini seç'; w=pw; m.pen=pw; }
  Object.assign(m,{played:true,hg,ag,win:w}); const l=w===m.home?m.away:m.home, sc=`${cname(m.home)} ${hg}-${ag} ${cname(m.away)}${m.pen?' (pen.)':''}`;
  if(k!=='final'){
    bumpConf(w,2,'Kupada finale yükseldi');
    newsAdd({type:'cup',club:w,title:`Kupa yarı final: ${sc}`,body:`${cname(w)} finale yükseldi, ${cname(l)} elendi.`});
    const [a,b]=S.cup.sf; if(a.played&&b.played&&!S.cup.final) S.cup.final=cupM('final',a.win,b.win);
  } else {

    newsAdd({type:'cup',big:true,club:w,title:`${cname(w)} kupayı kaldırdı!`,body:`Final: ${sc}. ${cname(w)} ${money(S.set.cupPrize)}, ${cname(l)} ${money(S.set.cupRunner)} ödül kazandı.`});

function streakNews(c,m){
  const L=ms().filter(x=>x.played&&x.season===m.season&&(x.home===c||x.away===c)).sort((a,b)=>a.week-b.week), res=L.map(x=>{ const f=x.home===c?x.hg:x.ag, g=x.home===c?x.ag:x.hg; return f>g?'W':f===g?'D':'L'; });

/* ================= OYUNCU PROFİLİ & MALİ KURALLAR (FFP / VERGİ) ================= */
function ffp(c,season=S.season){
  const T=S.transfers.filter(t=>t.season===season), spent=r2(T.filter(t=>t.to===c).reduce((a,t)=>a+t.price,0)), sold=r2(T.filter(t=>t.from===c).reduce((a,t)=>a+t.price,0));
  const net=r2(spent-sold), over=Math.max(0,r2(net-S.set.ffpLimit)), fine=r2(over*S.set.ffpRate/100);
  const bud=S.budget[c]||0, tax=bud>S.set.taxFloor?r2((bud-S.set.taxFloor)*S.set.taxRate/100):0;
  return {spent,sold,net,over,fine,tax,limit:S.set.ffpLimit,bud};
}
function applyFfp(sum){
  CIDS.forEach(c=>{ const f=ffp(c);
    if(f.fine>0){ pay(c,-f.fine,`FFP mali disiplin cezası (net harcama ${money(f.net)}, limit ${money(f.limit)})`,'vergi'); bumpConf(c,-3,'FFP cezası'); newsAdd({type:'finance',club:c,title:`${cname(c)}'e FFP cezası: ${money(f.fine)}`,body:`Sezon boyunca net transfer harcaması ${money(f.net)} oldu, limit ${money(f.limit)}. Aşan kısım için %${S.set.ffpRate} ceza kesildi.`},true); sum.lines.push(['FFP cezası',`${cname(c)} -${money(f.fine)}`]); }
    if(f.tax>0){ pay(c,-f.tax,`Servet vergisi (kasa ${money(f.bud)}, eşik ${money(S.set.taxFloor)})`,'vergi'); newsAdd({type:'finance',club:c,title:`${cname(c)} servet vergisi ödedi: ${money(f.tax)}`,body:`Kasa eşiği ${money(S.set.taxFloor)} üstündeki kısım için %${S.set.taxRate} vergi alındı.`},true); sum.lines.push(['Servet vergisi',`${cname(c)} -${money(f.tax)}`]); }
  });
}
function ffpWarn(c){ const f=ffp(c); if(f.over>0&&!S.news.slice(0,6).some(n=>n.type==='finance'&&n.club===c&&/FFP uyarısı/.test(n.title))) newsAdd({type:'finance',club:c,title:`FFP uyarısı: ${cname(c)} harcama limitini aştı`,body:`Net transfer harcaması ${money(f.net)}, limit ${money(f.limit)}. Sezon sonunda ${money(f.fine)} ceza kesilebilir. Oyuncu satarak dengeleyebilir.`},true); }
function ffpTab(){
  return `<div class="grid g2 keep2">${CIDS.map(c=>{ const f=ffp(c), pct=Math.min(100,f.limit?Math.max(0,f.net)/f.limit*100:0), col=f.over>0?'var(--bad)':pct>75?'var(--warn)':'var(--good)';
   return `<div class="card"><div class="row">${crest(c,32)}<b class="sp1">${esc(cname(c))}</b>${f.over>0?'<span class="pill bad">Limit aşıldı</span>':'<span class="pill good">Limit içinde</span>'}</div>

   <div class="grid g2 keep2" style="gap:8px;margin-top:12px;font-size:.86rem"><div class="kpi"><b>${money(f.spent)}</b><span>Alıma harcanan</span></div><div class="kpi"><b>${money(f.sold)}</b><span>Satıştan gelen</span></div><div class="kpi"><b class="${f.fine>0?'bad':''}">${money(f.fine)}</b><span>Beklenen FFP cezası</span></div><div class="kpi"><b class="${f.tax>0?'bad':''}">${money(f.tax)}</b><span>Beklenen servet vergisi</span></div></div></div>`; }).join('')}</div>

function careerOf(id){
  const bySeason={}; S.matches.filter(m=>m.played).forEach(m=>{ m.sc.forEach(([pid,n])=>{ if(pid===id){ (bySeason[m.season]=bySeason[m.season]||{g:0,a:0}).g+=n; } }); m.as.forEach(([pid,n])=>{ if(pid===id){ (bySeason[m.season]=bySeason[m.season]||{g:0,a:0}).a+=n; } }); });
  return bySeason;
}
function valueChart(p){
  const T=S.transfers.filter(t=>t.pid===p.id).sort((a,b)=>a.t-b.t), pts=T.map(t=>[`S${t.season}`,t.price]); pts.push(['Şimdi',p.val]); if(pts.length<2) return '';
  const W=420,H=150,pl=34,pr=12,pt=14,pb=24, mx=Math.max(...pts.map(x=>x[1]),1), X=i=>pl+(pts.length>1?i/(pts.length-1):0)*(W-pl-pr), Y=v=>H-pb-(v/mx)*(H-pt-pb);
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Değer geçmişi"><line x1="${pl}" x2="${W-pr}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--line)"/><text x="${pl-6}" y="${Y(mx)+4}" text-anchor="end" font-size="10" fill="var(--mut)">${Math.round(mx)}</text>
   <polyline class="ln" pathLength="1" fill="none" stroke="var(--accent)" stroke-width="2.6" stroke-linejoin="round" points="${pts.map((x,i)=>X(i)+','+Y(x[1])).join(' ')}"/>${pts.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x[1])}" r="4" fill="var(--accent)"/><text x="${X(i)}" y="${H-7}" text-anchor="middle" font-size="10" fill="var(--mut)">${x[0]}</text>`).join('')}</svg>`;
}
function ppResults(){
  const q=(UI.ppq||'').trim().toLowerCase(), found=q.length>=2?[...ALL.values()].filter(p=>p.name.toLowerCase().includes(q)).sort((a,b)=>b.ovr-a.ovr).slice(0,8):[];
  return found.length?`<div class="plist" style="margin-top:8px">${found.map(p=>pRow(p,`<button class="btn sm" data-act="profile" data-id="${p.id}">Profil</button>`)).join('')}</div>`:'';

function profileTalk(p,riv){
  const id='pf'+p.id, own=p.club?p.club:null, T=[], push=(who,txt,k)=>T.push({id:id+T.length,who,name:FNAME[who]||(ACC[who]&&ACC[who].name)||who,txt,at:Date.now()-T.length*3600e3*3,k:k||own,likes:20+hsh(id+T.length+'l')%300,rt:3+hsh(id+T.length+'r')%60,re:null});
  push(own?fanFor(id+'a',own):pickH(FANS,id+'a'),pickH([`${sn(p)} bu kadroda olmasa ne yapardık, Allah bilir.`,`${sn(p)} ${p.ovr} OVR değil, ${p.ovr+3} OVR gibi oynuyor!`,`${p.name} formasını giyen herkes gururlanmalı.`],id+'1'));
  if(riv&&riv.id!==p.id){ const rc=riv.club; push(fanFor(id+'b',rc),pickH([`${sn(riv)} (${riv.ovr}) ${sn(p)}'i (${p.ovr}) cebinden çıkarır, tartışması bile yok.`,`${sn(p)} mi? ${sn(riv)} oynuyor orada, kıyaslamayın!`],id+'2'),rc); push(own?fanFor(id+'c',own):pickH(FANS,id+'c'),`${sn(riv)} güzel oyuncu ama ${sn(p)} ${p.ovr>=riv.ovr?'daha iyi, rakamlar ortada':'bizde kalsın, formda olunca fark yaratır'}.`); }
  push(STA,`📊 ${p.name}: ${p.pos}, OVR ${p.ovr}, POT ${p.pot}, ${p.age} yaş, değer ${money(p.val)}.`); push(MNJ,`${sn(p)}'in menajeri olarak: ${p.val>=40?'bu oyuncu için küçük bütçeler konuşmasın.':'uygun fiyat, akıllı yatırım!'}`);
  return T;
}

function ambientTweets(){
  const out=[], base=S.news[0]?S.news[0].t:Date.now(), t=table();
  const N=64; let tcur=base-5*60e3;
  const push=(who,txt,club,seed,re)=>{ tcur-=(3+hsh(seed+'t')%11)*60e3; out.push({id:'amb'+out.length,who,name:FNAME[who]||(ACC[who]&&ACC[who].name)||who,txt,at:tcur,k:club||null,likes:8+hsh(seed+'l')%420,rt:1+hsh(seed+'r')%90,re:re||null}); };
  for(let i=0;i<N;i++){
    const seed='am'+i+S.season, kind=hsh(seed)%10, A=CIDS[hsh(seed+'a')%4], B=CIDS[(CIDS.indexOf(A)+1+hsh(seed+'b')%3)%4];
    const fa=fanFor(seed+'fa',A), fb=fanFor(seed+'fb',B), xa=bestAt(A,POSG[hsh(seed+'g')%8])||bestAt(A), xb=bestAt(B,xa?xa.g:null)||bestAt(B);
    if(kind<=1){ push(fa,pickH(TXT.boast,seed+'x')(A,xa),A,seed); if(hsh(seed+'rp')%2) push(fb,pickH(TXT.reply,seed+'y')(B,A),B,seed+'r',fa); }
    else if(kind===2||kind===3){ if(xa&&xb){ push(fa,pickH(TXT.cmp,seed+'c')(A,B,xa,xb),A,seed); push(fb,pickH(TXT.cmp,seed+'d')(B,A,xb,xa),B,seed+'d',fa); push(fanFor(seed+'z',A),pickH(TXT.reply,seed+'e')(A,B),A,seed+'e',fb); } }
    else if(kind===4||kind===5) push(fa,pickH(TXT.rage,seed+'r')(A,xa),A,seed);
    else if(kind===6||kind===7) push(hsh(seed+'mz')%2?MZH:pickH(FANS,seed+'f'),pickH(TXT.funny,seed+'f')(),null,seed);
    else if(kind===8){ const r=t[hsh(seed)%4]; push(STA,`📊 ${cname(r.c)}: ${r.rank}. sıra, ${r.pts} puan, ${r.gf} atılan / ${r.ga} yenilen gol. Son 5 maç: ${(r.form.slice(-5).join('')||'-')}`,r.c,seed); push(fa,`${cname(r.c)} bu sezon ${r.rank<=2?'rakiplere nefes aldırmıyor':'toparlanmaya çalışıyor'}!`,A,seed+'q'); }
    else { const c=CIDS[hsh(seed+'e')%4], f=ffp(c); push(MNJ,f.net>f.limit*.7?`${cname(c)} harcama limitine yaklaştı (${money(f.net)}/${money(f.limit)}). FFP kapıda!`:`${cname(c)} kasada ${money(S.budget[c])} ile rahat. Piyasa hareketli!`,c,seed); push(pickH(FANS,seed+'ff'),pickH(['Bu ligde para konuşuyor, ama hakkını veren kazanıyor.','FFP mi? Ben o kuralı hiç anlamadım, bana yeter.','Başkan parayı nereye harcıyor, kimse bilmiyor 😂'],seed+'h'),c,seed+'g'); }
  }
  return out;
}

function igPosts(c){
  const P_=[]; const add=(n,kind,extra)=>P_.push({id:n.id+kind,n,kind,c,at:n.t,...extra});
  S.news.forEach(n=>{
    if(n.type==='match'&&n.mid){ const m=S.matches.find(x=>x.id===n.mid&&x.played); if(m&&(m.home===c||m.away===c)) add(n,'result',{m}); }
    else if(n.type==='transfer'&&n.club===c&&n.pid!=null&&!/piyasaya sattı|ayırdı/.test(n.title)&&P(n.pid)) add(n,'welcome',{p:P(n.pid)});
    else if(n.type==='transfer'&&n.club===c&&n.pid!=null&&P(n.pid)) add(n,'farewell',{p:P(n.pid)});
    else if((n.type==='season'&&n.club===c&&/şampiyonu/.test(n.title))||(n.type==='cup'&&n.club===c&&/kupayı kaldırdı/.test(n.title))) add(n,'trophy',{cup:n.type==='cup'});
    else if(n.type==='award'&&n.club===c&&n.pid!=null&&P(n.pid)) add(n,'star',{p:P(n.pid)});
    else if((n.type==='streak'||n.type==='record')&&n.club===c) add(n,'stat');
    else if(n.type==='totw'&&n.totw&&n.club===c) add(n,'stat');
  });
  return P_.sort((a,b)=>b.at-a.at);
}

const IMGKEY='f17-img-v1'; let IMGC={}; try{ IMGC=JSON.parse(localStorage.getItem(IMGKEY)||'{}')||{}; }catch(e){ IMGC={}; }
const IMGFAIL=new Set(), IMGWAIT=new Map(); let imgBusy=0;
const normN=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const imgUrl=name=>IMGC[name]||null;
function saveImgC(){ try{ const k=Object.keys(IMGC); if(k.length>400) k.slice(0,k.length-400).forEach(x=>delete IMGC[x]); localStorage.setItem(IMGKEY,JSON.stringify(IMGC)); }catch(e){} }
async function fetchImg(name){
  const last=normN(name).split(/[\s.]+/).filter(x=>x.length>2).pop(); if(!last) return null;
  const u='https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrlimit=3&prop=pageimages&piprop=thumbnail&pithumbsize=500&gsrsearch='+encodeURIComponent(name+' footballer');
  const r=await fetch(u,{credentials:'omit'}); if(!r.ok) throw new Error('http'); const j=await r.json(), pg=Object.values((j.query&&j.query.pages)||{}).sort((a,b)=>(a.index||9)-(b.index||9));
  const hit=pg.find(p=>p.thumbnail&&normN(p.title).includes(last)); return hit?hit.thumbnail.source:0;
}
function phHtml(name,cls){
  const u=imgUrl(name); return `<span class="ig-ph ${cls||''} ${u?'ok':''}" data-pn="${esc(name)}">${u?`<img src="${esc(u)}" alt="${esc(name)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.classList.remove('ok');this.remove()">`:''}</span>`;
}
function loadImgs(){
  document.querySelectorAll('.ig-ph:not(.ok)[data-pn]').forEach(el=>{
    const n=el.dataset.pn; if(IMGC[n]===0||IMGFAIL.has(n)) return; if(IMGC[n]){ phFill(el,IMGC[n]); return; }
    if(IMGWAIT.has(n)){ IMGWAIT.get(n).push(el); return; } IMGWAIT.set(n,[el]); imgQueue();
  });
}
function phFill(el,u){ if(el.querySelector('img')) return; const im=document.createElement('img'); im.src=u; im.alt=el.dataset.pn; im.loading='lazy'; im.referrerPolicy='no-referrer'; im.onerror=()=>{ el.classList.remove('ok'); im.remove(); }; el.classList.add('ok'); el.appendChild(im); }
function imgQueue(){
  if(imgBusy>=3) return; const next=[...IMGWAIT.keys()].find(n=>!IMGWAIT.get(n).busy); if(!next) return; const waiters=IMGWAIT.get(next); waiters.busy=1; imgBusy++;
  fetchImg(next).then(u=>{ IMGC[next]=u||0; saveImgC(); if(u) document.querySelectorAll('.ig-ph[data-pn]').forEach(el=>{ if(el.dataset.pn===next) phFill(el,u); }); }).catch(()=>{ IMGFAIL.add(next); }).finally(()=>{ IMGWAIT.delete(next); imgBusy--; imgQueue(); });
  imgQueue();
}

function heat(a,b){
  const r=h2h(a,b); let h=0;
  r.L.slice(0,6).forEach((m,i)=>{ const d=Math.abs(m.hg-m.ag); h+=(i<3?2:1)*(d>=3?5:d===0?3:d===1?4:2); });
  (S.log||[]).slice(-3).forEach(x=>{ const t=x.table||[]; if(t.length>1){ const s=[t[0].c,t[1].c]; if(s.includes(a)&&s.includes(b)) h+=12; } });
  if(r.p>=4) h+=Math.max(0,10-Math.abs(r.wa-r.wb)*2);
  h+=(S.rv&&S.rv[pkey(a,b)])||0;
  return clamp(Math.round(h),0,100);
}
const heatLabel=h=>h>=S.set.derbyAt?'DERBİ':h>=S.set.derbyAt*.6?'Rekabet':'Sakin';
function revenge(a,b){ const m=h2h(a,b).L[0]; if(!m) return null; const d=m.hg-m.ag; if(Math.abs(d)<2) return null; const loser=d>0?m.away:m.home; return {c:loser,score:`${m.hg}-${m.ag}`}; }

}

const EVT_KEYS=Object.keys(EVT);
function fxChips(fx,risk){
  const a=[]; if(fx.m) a.push(`<span class="pill ${fx.m>0?'good':'bad'}">💰 ${smoney(fx.m)}</span>`);
  if(fx.c) a.push(`<span class="pill ${fx.c>0?'good':'bad'}">👥 Güven ${fx.c>0?'+':''}${fx.c}</span>`);
  if(fx.v) a.push(`<span class="pill ${fx.v>0?'good':'bad'}">Değer ${fx.v>0?'+':''}${fx.v}</span>`);
  if(fx.inj) a.push(`<span class="pill warn">${fx.inj} maç yok</span>`);
  if(fx.heal) a.push('<span class="pill good">Sakatlar erken döner</span>');
  if(fx.rv) a.push(`<span class="pill ${fx.rv>0?'warn':'good'}">Husumet ${fx.rv>0?'+':''}${fx.rv}</span>`);
  if(risk) a.push(`<span class="pill" title="${esc(risk.t)}">⚠ %${Math.round(risk.p*100)} risk</span>`);
  return a.join(' ');
}
function genEvents(m){
  [m.home,m.away].forEach(c=>{
    const o=c===m.home?m.away:m.home;
    S.evt.open.filter(e=>e.club===c).forEach(e=>{ e.age=(e.age||0)+1; if(e.age>=4) expireEvt(e); });
    if(S.evt.open.some(e=>e.club===c)||(hsh(m.id+'ev'+c)%1000)/10>=S.set.evtRate) return;
    const keys=EVT_KEYS.filter(k=>!EVT[k].ok||EVT[k].ok(c)); if(!keys.length) return;
    const key=keys[hsh(m.id+'ek'+c)%keys.length], d=EVT[key], p=d.who?d.who(c,m.id+'ep'+c):null; if(d.who&&!p) return;
    S.evt.open.push({id:'e'+(S.seq++),club:c,opp:o,key,pid:p?p.id:null,season:S.season,age:0,gen:m.id});
    toast(`${cname(c)}: karar bekliyor`,d.t(p,c,o),'');
  });
}

function applyFx(e,p,fx,label){
  const c=e.club, why=`Olay: ${label}`;
  if(fx.m) pay(c,fx.m,why,'olay','ev'+e.id);
  if(fx.c) bumpConf(c,fx.c,why);
  if(fx.v&&p) S.pl[p.id]=Object.assign(S.pl[p.id]||{},{val:Math.max(1,r2(p.val+fx.v))});
  if(fx.inj&&p) S.inj[p.id]={left:fx.inj,why:'Kırmızı kart',note:fx.injWhy||'Ceza',club:c,src:'ev'+e.id};
  if(fx.injRand){ const q=anyP(c,e.id+'ir'); if(q&&avail(q)) S.inj[q.id]={left:1,why:'Sakatlık',note:'Yorgunluk',club:c,src:'ev'+e.id}; }
  if(fx.rv&&e.opp){ S.rv=S.rv||{}; const k=pkey(c,e.opp); S.rv[k]=clamp((S.rv[k]||0)+fx.rv,-10,30); }

}

  applyFx(e,p,fx,ch.l);
  S.evt.open=S.evt.open.filter(x=>x!==e); const res=ch.res+(extra?' '+extra:'');

async function groqCall(sys,user,retry){
  const key=getKey(); if(!key) throw new Error('NOKEY');
  const body={model:lsGet(GM)||DEFMODEL,messages:[{role:'system',content:sys},{role:'user',content:user}],temperature:.9,max_tokens:1500};
  if(retry!=='nojson') body.response_format={type:'json_object'};
  const r=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Authorization':'Bearer '+key,'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(r.status===401) throw new Error('Anahtar geçersiz (401). Anahtarı kontrol et.');
  if(r.status===429) throw new Error('Ücretsiz limit doldu (429). Biraz bekleyip tekrar dene.');
  if(!r.ok){ let t=''; try{ t=(await r.json()).error.message; }catch(e){}
    if(r.status===404&&retry!=='model'){ const m=await groqModels(); if(m&&m!==body.model){ lsSet(GM,m); toast('Model değiştirildi',m,''); return groqCall(sys,user,'model'); } }
    if(r.status===400&&retry!=='nojson'&&/json|response_format/i.test(t)) return groqCall(sys,user,'nojson');
    throw new Error(`Groq hatası ${r.status}${t?': '+t:''}`); }
  const j=await r.json(); let o, txt=j.choices[0].message.content||''; try{ o=JSON.parse(txt); }catch(e){ try{ o=JSON.parse(txt.slice(txt.indexOf('{'),txt.lastIndexOf('}')+1)); }catch(e2){ throw new Error('Yanıt okunamadı, tekrar dene.'); } }
  const L=(o.lines||[]).filter(x=>x&&x.t&&CAST[x.s]).map(x=>({s:x.s,t:String(x.t).slice(0,260)})); if(!L.length) throw new Error('Boş yanıt, tekrar dene.'); return L;
}

  const map={}; free.forEach((w,i)=>{ map[w]=perm[i]; }); L.forEach(m=>{ if(map[m.week]!=null) m.week=map[m.week]; });

/* ================= ŞAMPİYONLUK İHTİMALİ & SEZON YILLIĞI ================= */
const ODDSC={key:'',v:null};
function champOdds(N=4000){
  const left=ms().filter(m=>!m.played), key=S.season+'|'+left.length+'|'+ms().filter(m=>m.played).map(m=>m.id+m.hg+m.ag).join(',');
  if(ODDSC.key===key&&ODDSC.v) return ODDSC.v;
  const tb=table(), base={}; tb.forEach(r=>{ base[r.c]=r; });
  const rem=left.map(m=>{ const {G}=grid(m.home,m.away), cdf=[]; let s=0; for(let i=0;i<=10;i++) for(let j=0;j<=10;j++){ s+=G[i][j]; cdf.push([s,i,j]); } return {m,cdf,tot:s}; });
  const R={}; CIDS.forEach(c=>{ R[c]={win:0,top2:0,last:0,pts:0,rk:[0,0,0,0]}; });
  for(let n=0;n<N;n++){
    const T={}; CIDS.forEach(c=>{ T[c]={c,pts:base[c].pts,gd:base[c].gd,gf:base[c].gf,r:Math.random()}; });
    rem.forEach(({m,cdf,tot})=>{ const u=Math.random()*tot; let k=0; while(k<cdf.length-1&&cdf[k][0]<u) k++; const [,i,j]=cdf[k], h=T[m.home], a=T[m.away];
      h.gf+=i; a.gf+=j; h.gd+=i-j; a.gd+=j-i; if(i>j) h.pts+=3; else if(i<j) a.pts+=3; else { h.pts++; a.pts++; } });
    const o=Object.values(T).sort((x,y)=>y.pts-x.pts||y.gd-x.gd||y.gf-x.gf||x.r-y.r);
    o.forEach((t,i)=>{ const q=R[t.c]; q.rk[i]++; q.pts+=t.pts; });
  }
  CIDS.forEach(c=>{ const q=R[c]; q.win=q.rk[0]/N*100; q.top2=(q.rk[0]+q.rk[1])/N*100; q.last=q.rk[3]/N*100; q.pts=q.pts/N; });
  const out={R,left:left.length,N}; ODDSC.key=key; ODDSC.v=out; return out;
}
var oddsTab=function(){
  const o=champOdds(), L=[...CIDS].sort((a,b)=>o.R[b].win-o.R[a].win||base0(b)-base0(a));
  function base0(c){ return table().find(r=>r.c===c).pts; }
  const f=v=>v>=99.95?'100':v<.05?'0':v<10?v.toFixed(1):Math.round(v);
  return `<div class="card"><h3>Şampiyonluk ihtimali</h3><p class="mut" style="margin-top:0">${o.left?`Kalan ${o.left} maç ${o.N.toLocaleString('tr-TR')} kez simüle edildi. Takım güçleri bahis oranlarında kullanılan modelle aynıdır (geçmiş sonuçlardan hesaplanır).`:'Sezon bitti: sonuç kesinleşti.'}</p>

    <div class="bar" style="margin:8px 0 4px"><i style="width:${q.win}%;background:${CL[c].c1}"></i></div><div class="mut" style="font-size:.8rem">İlk 2'de bitirme %${f(q.top2)} · Son sıra %${f(q.last)} · Sıralama dağılımı: ${q.rk.map((x,k)=>`${k+1}. %${f(x/o.N*100)}`).join(' · ')}</div></div>`; }).join('')}</div>`;

/* ---- "ŞAMPİYONLUK İÇİN NE LAZIM?" (tam sayım, 3^n senaryo) ---- */
const NEEDC={key:'',v:null};
function needCalc(){
  const left=ms().filter(m=>!m.played), key=S.season+'|'+left.map(m=>m.id).join(',')+'|'+ms().filter(m=>m.played).map(m=>m.id+m.hg+m.ag).join(',');
  if(NEEDC.key===key) return NEEDC.v;
  if(left.length>12){ NEEDC.key=key; NEEDC.v=null; return null; }
  const tb=table(), base=CIDS.map(c=>tb.find(r=>r.c===c).pts), idx=c=>CIDS.indexOf(c);
  const pr=left.map(m=>{ const H=probOf(m.home,m.away,(x,y)=>x>y), D=probOf(m.home,m.away,(x,y)=>x===y), A=probOf(m.home,m.away,(x,y)=>x<y), t=H+D+A||1; return [H/t,D/t,A/t]; });
  const R=CIDS.map(()=>({dist:{},mt:left.map(()=>[{w:0,s:0},{w:0,s:0},{w:0,s:0}]),champ:0,strict:0}));
  const out=new Array(left.length), P=base.slice();
  (function rec(i,w){
    if(i===left.length){
      const mx=Math.max(...P), win=[]; P.forEach((v,k)=>{ if(v===mx) win.push(k); }), k1=win.length===1;
      for(let c=0;c<4;c++){ const share=win.includes(c)?w/win.length:0, st=(k1&&win[0]===c)?w:0, r=R[c], d=r.dist[P[c]]||(r.dist[P[c]]={w:0,s:0,st:0});
        d.w+=w; d.s+=share; d.st+=st; r.champ+=share; r.strict+=st;
        left.forEach((m,j)=>{ if(m.home!==CIDS[c]&&m.away!==CIDS[c]) return; const o=out[j], oc=m.home===CIDS[c]?o:2-o, q=r.mt[j][oc]; q.w+=w; q.s+=share; }); }
      return; }
    const m=left[i], h=idx(m.home), a=idx(m.away);
    P[h]+=3; out[i]=0; rec(i+1,w*pr[i][0]); P[h]-=3;
    P[h]+=1; P[a]+=1; out[i]=1; rec(i+1,w*pr[i][1]); P[h]-=1; P[a]-=1;
    P[a]+=3; out[i]=2; rec(i+1,w*pr[i][2]); P[a]-=3;
  })(0,1);
  NEEDC.key=key; NEEDC.v={R,left,base}; return NEEDC.v;
}
function needTab(){

   ${done?`<div class="card flat" style="margin-top:12px;padding:14px;text-align:center;border:1px solid var(--accent)"><div style="font-size:1.6rem">🏆</div>${crest(tb[0].c,56)}<h2 style="margin:6px 0 0">${esc(cname(tb[0].c))} şampiyon</h2><div class="mut">${tb[0].pts} puan · ${tb[0].w}G ${tb[0].d}B ${tb[0].l}M</div></div>`:''}
   <div class="tbl-wrap" style="margin-top:12px"><table><thead><tr><th>#</th><th>Takım</th><th>O</th><th>G</th><th>B</th><th>M</th><th>AV</th><th>P</th></tr></thead><tbody>${tb.map((r,i)=>`<tr><td>${i+1}</td><td><div class="row">${crest(r.c,22)}<b>${esc(cname(r.c))}</b></div></td><td>${r.p}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td><td>${r.gf-r.ga>0?'+':''}${r.gf-r.ga}</td><td><b>${r.pts}</b></td></tr>`).join('')}</tbody></table></div>
   <h3 style="margin:16px 0 6px">Fikstür</h3>${weeks.map(w=>`<div style="font-weight:700;margin:10px 0 4px">${w}. hafta</div>${L.matches.filter(m=>m.week===w).map(m=>`<div class="row wrap" style="padding:6px 0;border-top:1px solid var(--line);gap:8px"><span class="row" style="flex:1;min-width:120px;justify-content:flex-end">${esc(cname(m.home))} ${crest(m.home,22)}</span><input type="number" min="0" max="99" inputmode="numeric" id="fh-${m.id}" value="${m.played?m.hg:''}" aria-label="${esc(cname(m.home))} gol" style="width:56px;text-align:center"><b>-</b><input type="number" min="0" max="99" inputmode="numeric" id="fa-${m.id}" value="${m.played?m.ag:''}" aria-label="${esc(cname(m.away))} gol" style="width:56px;text-align:center"><span class="row" style="flex:1;min-width:120px">${crest(m.away,22)} ${esc(cname(m.away))}</span><button class="btn sm ${m.played?'':'pri'}" data-act="funSave" data-l="${L.id}" data-m="${m.id}">${m.played?'Güncelle':'Kaydet'}</button>${m.played?`<button class="btn sm ghost" data-act="funClear" data-l="${L.id}" data-m="${m.id}" aria-label="Sonucu sil">✕</button>`:''}</div>`).join('')}`).join('')}
   <div class="row wrap" style="margin-top:14px"><button class="btn" data-act="funMore" data-l="${L.id}">+ Bir tur daha oyna</button><button class="btn ghost" data-act="funDel" data-l="${L.id}">Ligi sil</button></div></div>`;
}
PAGE.makara = ()=>{
  const F=funS(), cur=F.leagues.find(l=>l.id===UI.mlg)||F.leagues[F.leagues.length-1]||null; if(cur) UI.mlg=cur.id;
  const sel=UI.mkTeams||(UI.mkTeams=[...CIDS]);
  return `<div class="page-h"><h1>Makara Lig 🎲</h1><p class="mut">Sadece eğlence için: istediğin takımlarla, istediğin tur sayısıyla bir lig kur. Ana ligi, kasayı, istatistikleri, haberleri hiçbir şekilde etkilemez.</p></div>
   <div class="card"><h3>Yeni lig kur</h3><div class="grid g2"><div class="field"><label for="ml-name">Lig adı</label><input type="text" id="ml-name" placeholder="Örn. Cuma Gecesi Ligi" maxlength="40"></div>
   <div class="field"><label for="ml-r">Her çift kaç kez karşılaşsın?</label><select id="ml-r">${[1,2,3,4,5,6,8,10].map(n=>`<option value="${n}" ${n===2?'selected':''}>${n} kez${n===1?' (tek devre)':n===2?' (iç saha / deplasman)':''}</option>`).join('')}</select></div></div>
   <div class="field"><label>Takımlar (en az 2)</label><div class="row wrap" style="gap:8px">${CIDS.map(c=>`<label class="chk"><input type="checkbox" data-act-change="mkTeam" data-c="${c}" ${sel.includes(c)?'checked':''}> ${crest(c,20)} ${esc(cname(c))}</label>`).join('')}</div></div>
   <button class="btn pri" data-act="funCreate">Ligi kur ve fikstürü oluştur</button></div>
   ${F.leagues.length?`<div class="row wrap" style="margin:16px 0 8px"><b>Liglerin:</b>${F.leagues.map(l=>`<button class="btn sm ${cur&&l.id===cur.id?'pri':'ghost'}" data-act="funPick" data-l="${l.id}">${esc(l.name)}</button>`).join('')}</div>`:''}
   ${cur?funLeagueHtml(cur):'<div class="card" style="margin-top:12px"><div class="empty">Henüz makara lig yok. Yukarıdan takımları ve tur sayısını seçip kur.</div></div>'}`;
};
const funGet=id=>funS().leagues.find(l=>l.id===+id);
Object.assign(A,{
  mkTeam:el=>{ const sel=UI.mkTeams||(UI.mkTeams=[...CIDS]); const c=el.dataset.c; UI.mkTeams=el.checked?[...new Set([...sel,c])]:sel.filter(x=>x!==c); },
  funCreate:()=>{ const t=(UI.mkTeams||CIDS).filter(c=>CIDS.includes(c)); if(t.length<2){ toast('En az 2 takım seç','Lig için iki takım gerekli','bad'); return; }
    const r=+$('#ml-r').value||2, name=($('#ml-name').value||'').trim()||`Makara Lig ${funS().seq}`;
    if(mut(()=>{ const F=funS(), L={id:F.seq++,name,teams:t,rounds:r,matches:[]}; L.matches=funFixtures(t,r).map((m,i)=>({id:`f${L.id}-${i+1}`,...m})); F.leagues.push(L); UI.mlg=L.id; return null; })) toast('Lig kuruldu',`${name}: ${funGet(UI.mlg).matches.length} maç`,'good'); },
  funPick:el=>{ UI.mlg=+el.dataset.l; render(); },
  funSave:el=>{ const L=funGet(el.dataset.l), m=L&&L.matches.find(x=>x.id===el.dataset.m); if(!m) return; const h=$('#fh-'+m.id).value, a=$('#fa-'+m.id).value;
    if(h===''||a===''||+h<0||+a<0){ toast('Skoru gir','İki takımın golünü de yaz','bad'); return; }
    mut(()=>{ m.hg=Math.min(99,Math.floor(+h)); m.ag=Math.min(99,Math.floor(+a)); m.played=true; return null; }); },
  funClear:el=>{ const L=funGet(el.dataset.l), m=L&&L.matches.find(x=>x.id===el.dataset.m); if(m) mut(()=>{ m.played=false; m.hg=0; m.ag=0; return null; }); },
  funMore:el=>{ const L=funGet(el.dataset.l); if(!L) return; mut(()=>{ const wk=Math.max(0,...L.matches.map(m=>m.week))+1, k=L.matches.length, add=funFixtures(L.teams,1,wk); if(L.rounds%2) add.forEach(m=>{ const x=m.home; m.home=m.away; m.away=x; }); L.rounds++; add.forEach((m,i)=>L.matches.push({id:`f${L.id}-${k+i+1}`,...m})); return null; }); toast('Yeni tur eklendi',`${L.rounds} tur oldu`,'good'); },
  funDel:el=>{ const L=funGet(el.dataset.l); if(L&&confirm(`"${L.name}" ligi silinsin mi?`)) mut(()=>{ const F=funS(); F.leagues=F.leagues.filter(x=>x!==L); UI.mlg=null; return null; }); }
});

/* ================= CANLI SENKRON (db yeteneği) ================= */
let DB=null, DL=null;
const SYNC={state:'off',canWrite:true,owner:false,last:{},timer:null,busy:false,again:false,applying:false,unsubs:[],n:0};
const PARTS=['core','matches','ledger','news','xfer'];
function partsOf(){
  const {matches,ledger,news,transfers,...core}=S;
  return {core,matches:{a:matches},ledger:{a:ledger.slice(0,500)},news:{a:news.slice(0,150)},xfer:{a:transfers.slice(0,300)}};
}
function syncText(){
  return {off:'Senkron kapalı: veriler yalnızca bu tarayıcıda tutuluyor. Sayfayı Claude üzerinden açan ve düzenleme izni verilen herkes aynı ligi canlı görür.',
    wait:'Bağlanıyor…',live:`Canlı senkron açık. Değişiklikler herkese anında yansır${SYNC.owner?' (kurucu olarak veri sunucuda)':''}.`,
    read:'Canlı senkron açık, ama yalnızca okuyabilirsin. Değişiklik yapmak için sayfa sahibinden "Katkıda bulunan" izni iste.',
    empty:'Sunucuda henüz lig verisi yok. Sayfanın sahibi açınca başlangıç verisi yüklenecek.',err:'Senkron hatası: veri kaydedilemedi. Yedek al ve tekrar dene.'}[SYNC.state]||'';
}
function setSync(st){
  SYNC.state=st; const el=$('#sync'); if(el){ const lab={off:['Yerel','var(--mut)'],wait:['Bağlanıyor','var(--warn)'],live:['Canlı senkron','var(--good)'],read:['Salt okunur','var(--warn)'],empty:['Sunucu boş','var(--warn)'],err:['Senkron hatası','var(--bad)']}[st]; el.innerHTML=`<i class="dot" style="background:${lab[1]}"></i>${lab[0]}`; el.title=syncText(); }
  const i=$('#syncInfo'); if(i) i.textContent=syncText();
}
function schedulePush(){
  if(!DB||!SYNC.canWrite||SYNC.applying||SYNC.state==='wait') return;
  clearTimeout(SYNC.timer); SYNC.timer=setTimeout(flushPush,450);
}
async function flushPush(force){
  if(SYNC.busy){ SYNC.again=true; return; } SYNC.busy=true;
  try{
    const parts=partsOf();
    for(const k of PARTS){
      const j=JSON.stringify(parts[k]); if(!force&&j===SYNC.last[k]) continue;
      if(j.length>240000){ toast('Veri çok büyük',`${k} bölümü senkron limitini aştı`,'bad'); setSync('err'); continue; }
      await DB.doc('lg/'+k).set({j,ts:Date.now()}); SYNC.last[k]=j;
    }
    if(SYNC.state!=='err') setSync('live');
  }catch(e){
    if(e&&(e.code==='invalid_argument'||e.code==='not_granted')){ SYNC.canWrite=false; setSync('read'); } else { setSync('err'); }
  }
  SYNC.busy=false; if(SYNC.again){ SYNC.again=false; schedulePush(); }
}
function applyPart(k,j){
  let o; try{ o=JSON.parse(j); }catch(e){ return false; }
  if(k==='core'&&o.v!==2) return false;
  SYNC.applying=true;
  if(k==='core'){ const keep={matches:S.matches,ledger:S.ledger,news:S.news,transfers:S.transfers}; S=Object.assign({},o,keep); S.set=Object.assign({},DEFSET,S.set); S.bets=S.bets||[]; ensureCrisis(); }
  else if(k==='matches') S.matches=o.a; else if(k==='ledger') S.ledger=o.a; else if(k==='news') S.news=o.a; else if(k==='xfer') S.transfers=o.a;
  SYNC.last[k]=j; rebuild(); try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){}
  SYNC.applying=false; return true;
}
function remoteRender(){
  const a=document.activeElement, typing=a&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName);
  if(UI.modal||typing){ UI.dirty=true; return; } render();
}
document.addEventListener('focusout',()=>{ if(UI.dirty&&!UI.modal) setTimeout(()=>{ const a=document.activeElement; if(UI.dirty&&!UI.modal&&!(a&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName))){ UI.dirty=false; render(); } },250); });
async function initSync(){
  try{
    if(!window.claude||!claude.use) return;
    const [db,user,dl]=await Promise.all([claude.use('db'),claude.use('user'),claude.use('downloads')]);
    DL=dl||null; if(DL&&UI.page==='lig') render();
    if(!db){ return; } DB=db; setSync('wait');
    SYNC.owner=user?await user.isOwner():false;
    const w=user?await user.can('data.write'):null; SYNC.canWrite=w!==false;
    const snap=await DB.doc('lg/core').get();
    let okRemote=false; if(snap.exists){ try{ okRemote=JSON.parse(snap.data().j).v===2; }catch(e){} }
    if(okRemote){
      for(const k of PARTS){ const s=await DB.doc('lg/'+k).get(); if(s.exists) applyPart(k,s.data().j); }
      CIDS.forEach(fixLineup); render();
    } else if(SYNC.owner){ SYNC.applying=false; await flushPush(true); }
    else { setSync('empty'); }
    PARTS.forEach(k=>{
      const u=DB.doc('lg/'+k).onSnapshot(s=>{
        if(!s.exists||s.metadata.hasPendingWrites) return; const j=s.data().j; if(j===SYNC.last[k]) return;
        if(applyPart(k,j)){ remoteRender(); if(SYNC.n++>0) toast('Lig güncellendi','Biri değişiklik yaptı'); if(SYNC.state==='empty') setSync(SYNC.canWrite?'live':'read'); }
      },()=>{});
      SYNC.unsubs.push(u);
    });
    if(SYNC.state!=='empty') setSync(SYNC.canWrite?'live':'read');
  }catch(e){ console.error(e); setSync(DB?'err':'off'); }
}

boot();
